<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.addEventListener(
        'error',
        function (ev) {
          var src = ev && ev.filename ? String(ev.filename) : '';
          var msg = ev && ev.message ? String(ev.message) : '';
          if (
            /^(chrome|moz|safari-web)-extension:\/\//i.test(src) ||
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
